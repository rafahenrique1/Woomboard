name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run WoomboardCore unit tests
        run: |
          cd Packages/WoomboardCore
          swift test

      - name: Build unsigned WoomboardApp (with WoomboardKeyboard.appex)
        run: |
          xcodebuild \
            -project Woomboard.xcodeproj \
            -scheme WoomboardApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA for KravaSign
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/WoomboardApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: WoomboardApp.app not found at $APP_PATH"
            ls -la build/DerivedData/Build/Products/Release-iphoneos/ || true
            exit 1
          fi

          echo "Checking embedded keyboard extension:"
          ls -la "$APP_PATH/PlugIns/"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../Woomboard.ipa Payload
          ls -lh ../Woomboard.ipa

      - name: Upload Woomboard.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woomboard-IPA
          path: build/Woomboard.ipa
          retention-days: 14
