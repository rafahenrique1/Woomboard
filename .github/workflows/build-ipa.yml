name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run WoomboardCore unit tests
        run: |
          cd Packages/WoomboardCore
          swift test

      - name: Build unsigned WoomboardApp (with WoomboardKeyboard.appex)
        run: |
          xcodebuild \
            -project Woomboard.xcodeproj \
            -scheme WoomboardApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Info.plist & Package unsigned IPA for KravaSign
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/WoomboardApp.app"
          EXT_PATH="$APP_PATH/PlugIns/WoomboardKeyboard.appex"

          if [ ! -d "$APP_PATH" ] || [ ! -d "$EXT_PATH" ]; then
            echo "ERROR: Missing WoomboardApp.app or WoomboardKeyboard.appex"
            exit 1
          fi

          echo "=== App Info.plist ==="
          plutil -p "$APP_PATH/Info.plist"
          echo "=== Keyboard Extension Info.plist ==="
          plutil -p "$EXT_PATH/Info.plist"

          # Garante que NSExtension está presente (obrigatório para instalação no iOS)
          plutil -p "$EXT_PATH/Info.plist" | grep -q "com.apple.keyboard-service"
          plutil -p "$APP_PATH/Info.plist" | grep -q "UILaunchScreen"

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../Woomboard.ipa Payload
          ls -lh ../Woomboard.ipa

      - name: Upload Woomboard.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woomboard-IPA
          path: build/Woomboard.ipa
          retention-days: 14
