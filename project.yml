name: Woomboard
options:
  bundleIdPrefix: com.woomboard
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  WoomboardCore:
    path: Packages/WoomboardCore

targets:
  WoomboardApp:
    type: application
    platform: iOS
    sources:
      - path: WoomboardApp
        excludes:
          - Resources/Info.plist
          - Resources/WoomboardApp.entitlements
    dependencies:
      - package: WoomboardCore
      - target: WoomboardKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woomboard.app
        INFOPLIST_FILE: WoomboardApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  WoomboardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: WoomboardKeyboard
        excludes:
          - Resources/Info.plist
          - Resources/WoomboardKeyboard.entitlements
    dependencies:
      - package: WoomboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woomboard.app.keyboard
        INFOPLIST_FILE: WoomboardKeyboard/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.3.2"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        APPLICATION_EXTENSION_API_ONLY: YES

  WoomboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WoomboardTests
    dependencies:
      - target: WoomboardApp
      - package: WoomboardCore
